<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Cord | راست كورد - نظام متكامل</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Alexandria:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <!-- Login Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-box">
            <img src="logo.png" alt="RC" class="auth-logo">
            <h2 id="auth-title">تسجيل الدخول إلى راست كورد</h2>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="auth-username" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="auth-password" placeholder="أدخل كلمة المرور">
            </div>
            <button id="auth-btn" class="primary-btn">تسجيل الدخول</button>
            <p class="auth-switch">ليس لديك حساب؟ <span id="switch-to-register">إنشاء حساب</span></p>
        </div>
    </div>

    <div class="app-container" style="display: none;" id="app-main">
        <!-- Sidebar: Servers -->
        <aside class="server-sidebar">
            <div class="server-icon active" title="Rust Cord">
                <span class="server-initials">RC</span>
            </div>
            <div class="separator"></div>
            <div class="server-icon" title="Server 1">
                <img src="logo.png" alt="S1" style="width:100%">
            </div>
            <div class="server-icon add-server" title="إضافة سيرفر">
                <span>+</span>
            </div>
        </aside>

        <!-- Sidebar: Channels -->
        <aside class="channel-sidebar">
            <header class="sidebar-header" id="invite-trigger">
                <h1>راست كورد</h1>
                <div class="invite-badge">دعوة +</div>
            </header>

            <div class="channel-list">
                <div class="channel-category"><span>قنوات نصية</span></div>
                <div class="channel-item active">
                    <span class="hashtag">#</span>
                    <span class="channel-name">العامة</span>
                </div>
                <div class="channel-item">
                    <span class="hashtag">#</span>
                    <span class="channel-name">أخبار-البرنامج</span>
                </div>

                <div class="channel-category"><span>قنوات صوتية</span></div>
                <div class="channel-item">
                    <svg class="audio-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 1v22M5 8v8M2 10v4M19 8v8M22 10v4M15 5v14M9 5v14" />
                    </svg>
                    <span class="channel-name">غرفة الانتظار</span>
                </div>
            </div>

            <footer class="user-profile">
                <div class="user-avatar" id="current-user-avatar">
                    <div class="status-indicator online"></div>
                </div>
                <div class="user-info">
                    <span class="username" id="display-username">جاري التحميل...</span>
                    <span class="userid" id="display-role">#0000</span>
                </div>
                <div class="user-actions">
                    <button class="icon-btn" id="logout-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                    </button>
                </div>
            </footer>
        </aside>

        <!-- Main Content: Chat -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="header-left">
                    <span class="hashtag">#</span>
                    <h2 id="current-channel-name">العامة</h2>
                </div>
                <div class="header-right">
                    <div id="admin-badge"
                        style="display: none; background: var(--accent-rust); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">
                        ADIMN VIEW</div>
                </div>
            </header>

            <section class="messages-container" id="messages">
                <!-- Messages will be injected here -->
            </section>

            <footer class="input-area">
                <div class="input-container">
                    <button class="plus-btn">+</button>
                    <input type="text" placeholder="أرسل رسالة في #العامة" id="message-input">
                    <div class="input-actions">
                        <button class="emoji-btn">😊</button>
                    </div>
                </div>
                <div class="copyright">
                    جميع الحقوق محفوظة لصالح <strong>راست كورد</strong> &copy; 2024
                </div>
            </footer>
        </main>

        <!-- Right Sidebar: Members -->
        <aside class="members-sidebar">
            <div class="member-category">الأعضاء المتصلون</div>
            <div id="members-list">
                <!-- Members will be injected here -->
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>

</html>
